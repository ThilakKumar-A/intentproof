[project]
name = "intentproof-guard"
version = "0.1.0"
description = "Ask IntentProof before an AI agent is allowed to pay"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/ThilakKumar-A/intentproof"
Repository = "https://github.com/ThilakKumar-A/intentproof"

[project.scripts]
intentproof = "intentproof.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
intentproof = ["console.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
